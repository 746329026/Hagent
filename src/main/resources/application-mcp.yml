# ============================================================================
# MCP 客户端连接配置 —— 默认【不生效】，只在激活 mcp profile 时加载
# ============================================================================
#
# 为什么单独一份文件：这里的每条连接都会在启动时拉起一个子进程（java -jar …）。
# 若默认生效，全量 @SpringBootTest 每次都会拉 JVM —— 测试变慢变脆，还依赖"jar 已构建"。
# 单独一份 profile 让"要不要连外部工具"成为显式动作。
#
# 启动顺序不能反（先构建 server，再起主应用）：
#   .\mvnw.cmd -B -ntp -f MCP/time-server/pom.xml package
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local,mcp"
#
# Spring 会把同名 profile 的文件叠加到 application.yml 上，所以这里只写 MCP 的部分。
# ============================================================================
spring:
  ai:
    mcp:
      client:
        # 单次 MCP 请求超时：本地工具都是毫秒级，20s 足够宽；
        # 真正的"慢"通常是 server 起不来，那种情况应当快速失败而不是让用户干等。
        request-timeout: 20s

        stdio:
          connections:
            # 连接名 time 会出现在日志与工具名前缀里（mcp_hagent_time_…）
            time:
              # ★ 用 ${java.home} 而不是裸 java：裸 java 依赖 PATH，
              #   IDEA/服务启动时 PATH 常常没有 JDK，症状是"server 拉不起来"但报错只说找不到 java。
              command: "${java.home}/bin/java"
              args:
                - "-jar"
                # ${user.dir} = 启动时的工作目录（仓库根目录）。
                # 没构建 server 时，前置检查会以"文件不存在"立刻失败，而不是等 20 秒超时。
                - "${user.dir}/MCP/time-server/target/time-server-0.0.1-SNAPSHOT.jar"

            # 只接这一个 MCP server（时间）。接第二个只需再加一段 connection，但那是新需求。
