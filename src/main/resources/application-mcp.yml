# ============================================================================
# 阶段 16：MCP 客户端连接配置 —— ★ 默认【不生效】，只在激活 mcp profile 时加载
# ============================================================================
#
# 为什么单独一个文件、而不是写进 application.yml：
#   这里每一条连接都会在**启动时拉起一个子进程**（java -jar …）。
#   若它默认生效，那么 362 条 @SpringBootTest 每一次都去拉两个 JVM ——
#   测试变慢、变脆、还依赖"jar 已经构建过"。单独一份 profile 让"要不要连外部工具"
#   成为一个显式动作。
#
# 启动方式（顺序不能反：先构建 server，再起主应用）：
#   .\mvnw.cmd -B -ntp -f MCP/time-server/pom.xml package
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local,mcp"
#
# 它和主 application.yml 的关系：Spring 会把同名 profile 的文件叠加上去，
# 所以这里只需要写"MCP 的部分"，不用重复主配置。
# ============================================================================
spring:
  ai:
    mcp:
      client:
        # 单次 MCP 请求的超时。取值理由：本地 server 的工具都是毫秒级，
        # 20s 已经足够宽；而"慢"的典型原因是 server 起不来（在等 JVM），
        # 那种情况应当快速失败，而不是让用户盯着界面等。
        request-timeout: 20s

        stdio:
          connections:
            # ---------------------------------------------------------------
            # 连接名 time 会出现在两处：日志里的 MCP 连接、以及工具名前缀（mcp_time_…）
            # ---------------------------------------------------------------
            time:
              # ★ 用 ${java.home} 而不是裸 java：
              #   裸 java 依赖 PATH，而 IDEA / 服务里启动时 PATH 常常没有 JDK；
              #   症状是"server 拉不起来"，但报错只会说"找不到命令 java"，
              #   与我们的配置看起来毫无关系。${java.home} 是 JVM 自己的系统属性，必然正确。
              command: "${java.home}/bin/java"
              args:
                - "-jar"
                # ${user.dir} = 启动时的工作目录（本项目里就是仓库根目录）。
                # 所以"必须先构建 server"这条前置要求，会以"文件不存在"的形式立刻暴露。
                - "${user.dir}/MCP/time-server/target/time-server-0.0.1-SNAPSHOT.jar"

            # ---------------------------------------------------------------
            # 就到这里：本项目**只接这一个** MCP server（时间）。
            # 形状是"一个 server 一条 connection"，将来真要接第二个只加一段 —— 但那是
            # 新需求，不在本项目范围内（Excel server / 其余工具已移出范围，见 HANDOFF）。
            # ---------------------------------------------------------------
