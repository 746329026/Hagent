spring:
  application:
    name: hagent

  profiles:
    # local = 私有配置（密钥/数据库密码），由 application-local.yml 覆盖，该文件不进仓库
    active: local

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

server:
  port: 8123
  servlet:
    # 统一 URL 前缀，便于网关转发与前后端联调区分
    context-path: /api
  tomcat:
    connection-timeout: 60s

# 异步请求超时。多步 Agent / RAG 远超 Tomcat 默认 30s，过小会把流式接口静默掐断。
# 注意：与 SseEmitter 自身超时取较小值生效，两处必须协调。
spring.mvc.async.request-timeout: 600s

# ============================== AI 配置 ==============================
spring.ai:
  # ★ 能力归属声明：两个模型 starter 同时存在时各建一个 ChatModel Bean，会导致启动失败。
  #   用配置表达分工，而不是用 @Primary 消除冲突。
  model:
    chat: deepseek
    embedding: ollama

  # ---------- MCP 客户端（默认不连，演示时加 mcp profile，见 application-mcp.yml）----------
  mcp:
    client:
      # ★ 必须关闭：starter 默认注册 SyncMcpToolCallbackProvider（也是 ToolCallbackProvider），
      #   与 ToolRegistration 的同类型 Bean 并存会让 AgentPipeline 注入失败。
      #   关掉后工具清单只从 ToolRegistration 出（本地工具 + MCP 工具在那里合并）。
      toolcallback:
        enabled: false

  # ---------- chat：DeepSeek 云端 ----------
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    chat:
      options:
        # 账号可用模型只有 deepseek-flash / deepseek-v4-pro；请求不存在的模型名会静默降级且不报错，
        # 所以启动探针要核对"实际返回的模型名"。
        model: deepseek-flash
        # ★ 不设 temperature：deepseek-flash 是推理模型，thinking 模式下服务端会忽略采样参数
        #   （配了不报错，也不生效）。稳定性靠推理与结构化约束，不靠一个被忽略的参数。
        # 推理档位只有 HIGH / MAX（不用 MAX：更慢更贵）。API 只接受小写，
        # Spring AI 枚举上带 @JsonProperty("high") 保证序列化正确。
        reasoning-effort: HIGH

  # ---------- embedding：Ollama 本地（1024 维）----------
  # 入库要对成百上千个切片做向量化，调用量远大于对话；DeepSeek 不提供 embedding API，
  # 这一层必须换实现，本地 mxbai-embed-large 零边际成本。
  ollama:
    base-url: http://localhost:11434
    embedding:
      options:
        model: mxbai-embed-large:latest

  # ---------- 向量库：pgvector ----------
  # 框架的 pgvector 自动装配没有独立数据源参数，会复用全局 DataSource（= MySQL），
  # 因此本项目显式装配自己的 pgVectorDataSource + PgVectorStore，表名也用项目专属名。
  vectorstore:
    pgvector:
      table-name: hagent_knowledge
      schema-name: public
      index-type: HNSW
      distance-type: COSINE_DISTANCE
      dimensions: 1024
      # ★ 必须为 true：initializeSchema 为假时框架跳过建表，而 schema-validation 默认也为假，
      #   于是表永远不会被创建，直到第一次写入才报错。
      initialize-schema: true
      # 保持 false：本项目要的是"建表"，表结构正确性由启动自检用事实核对。
      schema-validation: false
      vector-table-validations-enabled: false

# ============================== Hagent 自有配置 ==============================
hagent:
  # ---------- RAG 知识库 ----------
  rag:
    ingest:
      # 知识库根目录；所有文档必须在它之内（SourceLoader 会拒绝越界路径）
      root-dir: "${user.dir}/knowledge"
      # ★ 刻意不给默认值：kind 决定切分策略与默认密级，猜错会导致"用错策略入库"或
      #   "密级被放宽"（越权风险），所以必须显式配置，缺失即启动失败。
      default-kind: POLICY
      # 只存不用：多部门用户取并集还是交集属于组织架构问题，需业务定义后再做过滤。
      dept: ""
      extensions:
        - ".md"
        - ".txt"

    chunking:
      # embedding 模型 mxbai-embed-large 实测输入上限约 1000 汉字，超出部分被静默截断
      # （不报错、维度正常，但后半段检索不可见）。400 只用约 40%，留足余量。
      max-size: 400
      # 相邻块重叠，防止语义被块边界切断
      overlap: 60
      # ⚠️ 当前代码未读取此键（已知债务：碎片尾块合并未接线）；值仅为保持配置完整。
      min-tail-ratio: 0.25

    retrieval:
      # 关掉后检索能力整体拔掉（模型看不到该工具），用于排查"问题在检索还是模型"
      enabled: true

      # 3 条 × 最多 400 字 ≈ 1200 token，约占会话历史预算 5000 的 24%
      top-k: 3

      # ★ 以下单位均为余弦距离（0=相同，1=正交，2=相反），与 calibration 证据同单位。
      #   实测相关与无关提问的距离分布重叠，没有阈值能兼顾 —— 0.5 的定位是粗筛，
      #   真正的兜底是提示词约束。换 embedding 模型后必须重新校准。
      max-distance: 0.5
      high-max-distance: 0.30
      medium-max-distance: 0.45

    prompt:
      # 提示词外置：改提示词不需要改 Java/重新编译，git 能 diff。资源缺失或为空时启动即失败。
      constraint-resource: "classpath:prompts/rag-answer-prompt.md"
      # 仅用于对照实验：关掉它才能说明"约束到底起了多少作用"
      include-constraint: true

  # ---------- 工具调用审计 ----------
  tool:
    audit:
      # 默认开启：审计只能从现在开始攒，事后无法补录；关掉只会打 WARN，不会静默。
      enabled: true
      # 表由显式 DDL 创建（db/chat_tool_invocation.sql），启动时校验表与索引是否存在
      table-name: chat_tool_invocation

  # 启动探针：live-call=true 时真调一次 chat 与 embedding，拿到"模型真能用"的证据
  probe:
    live-call: true

  # ---------- Agent 循环上限（按模式两档）----------
  # 正常出口是"模型不再请求工具"，但模型绕圈时不会自己结束，而每次循环都是一次计费调用；
  # 这里是唯一由我们控制的强制出口。
  agent:
    # chat：一次对话里最多允许的模型调用步数
    chat-max-steps: 10
    # workflow：多步循环，每步工具返回都可能是一整篇文档，给大一倍
    workflow-max-steps: 20

  # 调用链日志（前缀不复用已删除的 advisor 概念）
  trace:
    enabled: true
    # 必须截断：一次 RAG 调用可能带几千字检索结果，全量写日志会撑爆文件并泄露文档内容
    max-log-length: 500
    # 排查时临时改 true，不是常态
    log-full-content: false

  stream:
    # SSE 服务端超时；与 spring.mvc.async.request-timeout 取较小值，两处必须协调
    sse-timeout-ms: 600000
    # ⚠️ 当前代码未读取此键：SSE 尚未实现心跳保活（已知债务）；部署在网关后需保证读超时足够长。
    heartbeat-interval-ms: 15000
    # 告诉浏览器的重连间隔（SSE retry），断开后避免立刻重连加剧压力
    reconnect-delay-ms: 5000

  web:
    # CORS 白名单。不用 allowedOriginPatterns("*") + allowCredentials(true)：
    # 那既是对全网放开，也违反 CORS 规范。
    # localhost 与 127.0.0.1 是不同源，两个都要配。
    allowed-origins:
      - "http://localhost:5500"
      - "http://127.0.0.1:5500"
      - "http://localhost:8080"
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
    # 预检缓存：开发期小一点便于改配置立即生效，生产可调大
    max-age-seconds: 300

  memory:
    chat:
      # 两个角色，不是"一份数据两种存法"：
      #   记录层 MySQL = 用户可见的完整对话记录（权威、永久，刷新页面要看到）
      #   上下文层 Redis = 模型这次要用的上下文（有损、TTL、可从记录层重建）
      # 旧键 type 已废弃：配了会启动失败并提示改成这两个键（刻意不留兼容层）。
      record-store: mysql
      context-cache: redis

      # 某层失败后静默多少秒不再尝试它。不熔断时每个请求都要白等一次连接超时（3s/5s），
      # 故障期体验反而比正常更差。0 = 关闭熔断。
      circuit-break-seconds: 30

      # 预算只约束【历史消息】，不含 system 与本次问题（结构上杜绝"截断丢掉当前问题"）
      # 键名里的 chat 指工作模式，与 workflow 并列，不是"会话数据"。
      chat-max-tokens: 5000
      chat-max-messages: 30
      # workflow 每轮工具返回都可能是一整篇文档，预算大一个数量级
      workflow-max-tokens: 50000
      workflow-max-messages: 200

      # 步数上限已搬到 hagent.agent.*，这里只管"历史能有多长"（token / 条数）

      # file 记录层：零基础设施兜底 + 人可读，不是生产主路径
      file-dir: "${user.dir}/tmp/chat-memory"

      # Redis 值的含义是【缓存寿命】而非数据寿命：过期后回源 MySQL，历史不会丢
      redis-ttl-seconds: 86400
      redis-key-prefix: "hagent:chat:memory:"

      # 两张表由显式 DDL 创建（db/*.sql），应用不自动建表，启动时校验结构
      mysql-table-name: chat_message
      conversation-table-name: chat_conversation

    long-term:
      # {dir}/{userId}/MEMORY.md 是索引，mem-*.md 是每条记忆；缺失/为空时启动失败
      dir: "${user.dir}/tmp/agent-memory"
      # 索引每轮注入 system，直接吃会话预算；超限时拒绝写新记忆（不静默淘汰旧条目）
      index-max-chars: 1000
      # 单条记忆正文上限：只在 readMemory 时进上下文，不占常驻预算
      content-max-chars: 2000
      title-max-chars: 60

  # pgvector 专用数据源：独立前缀，不与业务主库 spring.datasource 混用。
  # 池参数取舍：向量库用量小（min-idle=1 避免每次检索重建连接）；
  #   connection-timeout 刻意比 MySQL 短 —— 向量库失败要快速走降级（"检索暂不可用"），
  #   而不是让用户挂等 30 秒。
  vectorstore:
    datasource:
      url: jdbc:postgresql://localhost:5432/hagent
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      pool-name: HagentPgVectorPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

# ============================== 日志 ==============================
logging:
  file:
    name: "${user.dir}/logs/hagent.log"
  level:
    root: INFO
    com.hagent: DEBUG
